<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focusly – to-do list &amp; focus timer</title>
<style>
:root{--bg:#0f0f10;--panel:#18181a;--card:#141415;--text:#f2f2f4;--muted:#8d8d96;--line:#27272b;--hover:#222226;--accent:#5ed3c0;--ok:#4ade80;--bad:#ff7a6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f1;--panel:#fff;--card:#fff;--text:#18181b;--muted:#72727c;--line:#e3e3df;--hover:#eeeeea;--accent:#1fa893;--ok:#16a34a;--bad:#d6402f;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f4f1;--panel:#fff;--card:#fff;--text:#18181b;--muted:#72727c;--line:#e3e3df;--hover:#eeeeea;--accent:#1fa893;--ok:#16a34a;--bad:#d6402f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--text)}
.shell{display:flex;gap:28px;padding:20px 24px 120px;max-width:1280px;margin:0 auto}
aside{width:270px;flex-shrink:0}
.pn{background:var(--panel);border-radius:16px;padding:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800}
.brand svg{width:34px;height:34px}.beta{font-size:10px;background:#7ee0a8;color:#10321f;padding:1px 6px;border-radius:6px;font-weight:700}
.plan{font-size:17px;font-weight:600;margin-top:8px}.pl2{color:var(--muted);margin-top:14px;font-size:14px}
.nv{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:16px}
.nv:hover{background:var(--hover)}.nv.on{background:var(--hover);color:var(--text)}
.nv.new{color:var(--muted);display:flex;gap:10px;margin-bottom:8px}
hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
.sc{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:34px}
.top h1{margin:0;font-size:28px;font-weight:700}.top p{margin:2px 0 0;color:var(--muted);font-size:17px}
.act{display:flex;align-items:center;gap:6px;background:var(--panel);padding:8px 12px;border-radius:16px}
.ib{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:flex}.ib:hover{color:var(--text);background:var(--hover)}.ib svg{width:22px;height:22px}
.pill{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(90deg,#ff7ad9,#7ad9ff,#a3f08c) border-box;border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:6px;align-items:center;font-weight:500}
.av{width:34px;height:34px;border-radius:50%;background:var(--hover);border:0;cursor:pointer;font-weight:600}
#sq{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:170px;outline:none}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;gap:10px}
.hd h2{margin:0;font-size:26px}.hd span{color:var(--muted);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;max-width:960px}
.lc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:340px;display:flex;flex-direction:column;cursor:pointer}
.lc:hover{border-color:var(--muted)}
.lh{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;color:var(--muted);margin-bottom:18px}
.lh i{font-style:normal;background:var(--hover);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:16px;color:var(--muted)}
.lh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:17px}
.lr b{color:var(--muted);font-weight:400;font-size:12px;padding-top:4px}.lr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr em{font-style:normal;color:var(--muted);font-size:14px;padding-top:2px}
.lf{margin-top:auto;display:flex;justify-content:space-between;font-weight:600;font-size:14px;padding-top:12px}
.mn{position:absolute;right:12px;top:48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:5;min-width:130px}
.mn button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}.mn button:hover{background:var(--hover)}
.cl{border:2px dashed var(--line);background:var(--card);border-radius:14px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:var(--muted);cursor:pointer;font-size:30px;font-weight:700}
.cl span{font-size:20px}.cl:hover{border-color:var(--muted)}
.back{background:none;border:0;color:var(--muted);cursor:pointer;margin-bottom:10px;font-size:15px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;max-width:760px}
.task.live{border-color:var(--accent)}.row{display:flex;align-items:center;gap:10px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;flex-shrink:0;padding:0;color:#111;font-size:13px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{background:linear-gradient(90deg,#5ed3c0,#c4e66a);color:#10231d;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn.sm{padding:5px 12px;font-size:13px}.btn.ghost{background:var(--hover);color:var(--text);font-weight:500}
.notes{margin-top:8px;width:100%;min-height:60px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.empty{color:var(--muted);padding:30px 0}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs{display:flex;gap:6px}.tab{background:none;border:0;color:var(--muted);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;gap:8px;align-items:center}
.tab svg{width:20px;height:20px}.tab.on{background:var(--hover);color:var(--text)}
.dr{display:flex;align-items:center;gap:14px}
.help{display:flex;align-items:center;gap:10px;background:var(--hover);border:0;border-radius:14px;padding:6px 16px;cursor:pointer;font-size:16px}
.ring{width:38px;height:38px;position:relative}.ring svg{width:38px;height:38px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px}
#focus{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));background:#17171c;color:#fff;border:1px solid #2c2c35;border-radius:16px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.45);display:none;z-index:20}
#focus.show{display:block}#focus .ft{font-size:13px;opacity:.7;display:flex;justify-content:space-between}
#focus .ftt{font-weight:600;font-size:16px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}#clock.over{color:#ff7a6b}
.bar{height:6px;background:#33333c;border-radius:4px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ed3c0,#c4e66a);width:0}
#focus .btns{display:flex;gap:8px;flex-wrap:wrap}#focus .btn.ghost{background:#2a2a33;color:#fff}
body.blitz #focus{top:0;left:0;bottom:0;transform:none;width:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:50}
body.blitz #clock{font-size:min(22vw,120px)}body.blitz #focus .bar{width:min(420px,80%)}body.blitz .ftt{font-size:26px;white-space:normal}
.cel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 18px;border-radius:12px;font-weight:700;z-index:90;display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#modal.show{display:flex}.mb{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,100%)}
.mb h3{margin:0 0 14px}.mb input,.mb select,.mb textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:10px}
.mb .bt{display:flex;gap:8px;justify-content:flex-end}.mb p{color:var(--muted)}
.card2{background:var(--panel);border-radius:14px;padding:18px;margin-bottom:14px;max-width:760px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:760px;margin-bottom:14px}
.stats .card2{margin:0}.stats b{font-size:26px;display:block}.stats span{color:var(--muted);font-size:13px}
.hb{display:flex;align-items:center;gap:10px;margin:10px 0}.hb .nm{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.hb .tr i{display:block;height:100%;background:linear-gradient(90deg,#5ed3c0,#c4e66a)}
.set{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.set input[type=number]{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px}
kbd{background:var(--hover);padding:1px 6px;border-radius:4px;font-size:12px}
.sw{width:40px;height:22px;border-radius:12px;border:0;background:var(--line);position:relative;cursor:pointer;flex-shrink:0}.sw:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:#1f9d63}.sw.on:after{left:21px}.pf{max-height:62vh;overflow:auto;padding-right:6px}.pf h4{margin:16px 0 4px;font-size:14px}.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;color:var(--muted);font-size:14px}.pr.sub{padding-left:18px}.pc{display:flex;align-items:center;gap:8px}.pr select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:150px}.seg{display:flex;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;color:var(--muted)}.seg button.on{background:linear-gradient(90deg,#5ed3c0,#9fe38a);color:#10231d;font-weight:600}.scr{width:120px;height:70px;border-radius:8px;border:2px solid #5ed3c0;background:linear-gradient(135deg,#d946ef,#6366f1,#22d3ee);display:grid;place-items:center;font-size:11px;color:#fff}.sws{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}.sws button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.sws button.on{border-color:var(--text)}.ic{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;margin:0 auto 6px;cursor:pointer;font-size:24px;background-size:cover}.ac{margin:auto;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.06em}.ac b{display:block;font-size:26px;color:var(--accent)}.lc .op{display:none;position:absolute;left:50%;top:45%;transform:translateX(-50%)}.lc:hover .op{display:block}.mb:has(.pf){width:min(560px,100%)}@keyframes fl{50%{box-shadow:0 0 0 5px #ff7a6b}}#focus.flash{animation:fl .5s 6}body.ht .meta,body.ht .lr em{display:none}@media(min-width:801px){#focus.l{left:24px;transform:none}#focus.r{left:auto;right:24px;transform:none}}@media(max-width:800px){.shell{flex-direction:column;gap:0;padding:14px 14px 120px}aside{width:100%}.top{flex-wrap:wrap;margin-bottom:22px}.dr .help span{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside><div class="pn"><div class="brand"><svg viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ad9"/><stop offset=".5" stop-color="#7ad9ff"/><stop offset="1" stop-color="#a3f08c"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#g)"/><path d="M9 16.5l5 5 9-10" stroke="#111" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Focusly</div><div class="plan">Created by Ortah</div><div class="pl2">Everything is saved in this browser.</div></div>
  <div class="pn" id="nav"></div></aside>
  <section class="sc"><div class="top" id="top"></div><div id="content"></div></section>
</div>
<div class="dock" id="dock"></div>
<div id="focus"></div><div id="modal"></div><div class="cel" id="cel"></div>
<script>
(function(){
var KEY='focusly-v2';
var S={name:'',named:false,lists:[{id:'l1',name:'Studying',arch:false}],tasks:[{id:'t1',title:'Math',list:'l1',est:90,spent:0,done:false,notes:''}],view:'home',q:'',searching:false,menu:null,modal:null,active:null,paused:true,theme:'',pomo:{on:false,work:60,brk:10},pr:{side:'right',hide:false,tz:'Europe/London',scroll:false,alerts:true,every:15,asnd:'Melodic',flash:true,notif:true,nsnd:'Futuristic',success:true,gif:true,sfx:true,ssnd:'Victory Bell'},sprint:0,brk:0};
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.lists)S=Object.assign(S,p,{modal:null,menu:null,searching:false,q:''})}}catch(e){}
if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);
var IC={search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10H3z"/></svg>',bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10M12 20V4M18 20v-6"/></svg>',bolt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>'};
var BASE=document.title,AC,COL=['linear-gradient(135deg,#ff7ad9,#7ad9ff)','#6c8cff','#b5d84a','#ff5ad1','#5ed3c0','#2bd4e0','#ffd84a','#111'],SND={Melodic:[523,659,784],Chime:[988,1319],Beep:[800,800],Futuristic:[330,660,990,1320],Bell:[1047,784],'Victory Bell':[523,659,784,1047,1319],Fanfare:[392,392,392,523]},TZ=['Europe/London','Europe/Paris','Europe/Berlin','America/New_York','America/Chicago','America/Los_Angeles','Asia/Dubai','Asia/Tehran','Asia/Kolkata','Asia/Tokyo','Australia/Sydney','UTC'],MN=[[5,'5 mins'],[10,'10 mins'],[15,'15 mins'],[20,'20 mins'],[30,'30 mins'],[60,'60 mins']];
function tone(n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var s=SND[n]||SND.Melodic,t0=AC.currentTime;s.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),t=t0+i*.18;o.type=n==='Futuristic'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.32)})}catch(e){}}
function sysn(m){try{if(S.pr.notif&&window.Notification&&Notification.permission==='granted')new Notification('Focusly',{body:m})}catch(e){}}
function ping(m){tone(S.pr.asnd);sysn(m);if(S.pr.flash){var f=$('focus');f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash')}celebrate(m)}
function note(m){if(S.pr.notif)tone(S.pr.nsnd);sysn(m);celebrate(m)}
function rp(){var sc=document.querySelector('.pf'),y=sc?sc.scrollTop:0;render();sc=document.querySelector('.pf');if(sc)sc.scrollTop=y}
function T(k,on){return '<button class="sw'+(on?' on':'')+'" data-act="tg" data-k="'+k+'"></button>'}
function R(l,c,s){return '<div class="pr'+(s?' sub':'')+'"><span>'+l+'</span><span class="pc">'+c+'</span></div>'}
function SEL(k,o,v){return '<select data-pk="'+k+'">'+o.map(function(x){var a=[].concat(x);return '<option value="'+a[0]+'"'+(String(a[0])===String(v)?' selected':'')+'>'+(a[1]||a[0])+'</option>'}).join('')+'</select>'}
function SG(k,v,o){return '<span class="seg">'+o.map(function(x){return '<button class="'+(x[0]===v?'on':'')+'" data-act="sg" data-k="'+k+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</span>'}
function SD(k){return '<button class="ib" data-act="pv" data-k="'+k+'" title="Preview">▶</button>'+SEL(k,Object.keys(SND),S.pr[k])}
function prefsHTML(){var p=S.pr;return '<h3 style="margin:0">Preferences</h3><p style="margin:2px 0 8px">Customize your workflow for a personalized experience</p><div class="pf"><h4>Blitz Panel</h4>'+R('Select screen','<span class="scr">Screen 1</span>')+R('Blitz Panel Side',SG('side',p.side,[['left','Left'],['right','Right']]))+'<h4>General</h4>'+R('Hide est/done times on tasks',T('hide',p.hide))+R('Theme',SG('theme',S.theme||'',[['','System'],['dark','Dark'],['light','Light']]))+'<h4>Time</h4>'+R('Timezone',SEL('tz',TZ,p.tz))+'<h4>Blitz mode settings</h4>'+R('Pomodoros',T('pomo',S.pomo.on))+(S.pomo.on?R('Work sprint length',SEL('work',[[15,'15 mins'],[25,'25 mins'],[30,'30 mins'],[45,'45 mins'],[60,'60 mins'],[90,'90 mins']],S.pomo.work),1):'')+R('Default break length',SEL('brk',MN,S.pomo.brk))+R('Scrolling title on live timer',T('scroll',p.scroll))+'<h4>Alerts</h4>'+R('Timed alerts during a task',T('alerts',p.alerts))+(p.alerts?R('Pick task alert timings',SEL('every',MN,p.every),1)+R('Pick an alert sound',SD('asnd'),1)+R('Animated flash on timer',T('flash',p.flash),1):'')+R('Notification Alerts',T('notif',p.notif))+(p.notif?R('Pick an alert sound',SD('nsnd'),1):'')+'<h4>Celebrate task completion</h4>'+R('Show success screen',T('success',p.success))+(p.success?R('Fun gif on success screen',T('gif',p.gif),1):'')+R('Success sound effect',SD('ssnd')+T('sfx',p.sfx))+'</div><div class="bt" style="margin-top:12px"><button class="btn ghost sm" data-act="reset">Reset all data</button><button class="btn sm" data-act="mclose">Done</button></div>'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)}
function pad(n){return (n<10?'0':'')+n}
function fmt(s){s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
function hhmm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function estStr(m){var h=Math.floor(m/60),r=m%60;return (h?h+'hr ':'')+(r||!h?r+'min':'')}
function task(id){return S.tasks.filter(function(t){return t.id===id})[0]}
function list(id){return id==='all'?{id:'all',name:'All Lists'}:S.lists.filter(function(l){return l.id===id})[0]}
function lname(id){var l=list(id);return l?l.name:'—'}
function pending(id){return S.tasks.filter(function(t){return (id==='all'||t.list===id)&&!t.done})}
function curList(){return S.view.indexOf('list:')===0?S.view.slice(5):null}

function renderNav(){
  var v=S.view,h='<button class="nv new" data-act="newlist"><span>+</span> Create new list</button><hr>';
  h+='<button class="nv'+(v==='home'?' on':'')+'" data-act="go" data-id="home">All my lists</button>';
  h+='<button class="nv'+(v==='archived'?' on':'')+'" data-act="go" data-id="archived">Archived lists</button>';
  var ls=S.lists.filter(function(l){return !l.arch});
  if(ls.length){h+='<hr>';ls.forEach(function(l){h+='<button class="nv'+(v==='list:'+l.id?' on':'')+'" data-act="open" data-id="'+l.id+'">'+esc(l.name)+'</button>'})}
  $('nav').innerHTML=h;
}
function renderTop(){
  var hr=+new Intl.DateTimeFormat('en-GB',{hour:'numeric',hour12:false,timeZone:S.pr.tz}).format(new Date())%24,tod=hr<12?'Morning':hr<18?'Afternoon':'Evening';
  $('top').innerHTML='<div><h1>Good '+tod+(S.name?', '+esc(S.name):'')+'</h1><p>Nice! Blitzing through your '+tod.toLowerCase()+'!</p></div>'+
   '<div class="act">'+(S.searching?'<input id="sq" type="text" placeholder="Search tasks" value="'+esc(S.q)+'">':'')+
   '<button class="pill" data-act="blitznow">'+IC.bolt+' Blitz now</button>'+
   '<button class="ib" data-act="search" title="Search">'+IC.search+'</button>'+
   '<button class="ib" data-act="prefs" title="Preferences">'+IC.gear+'</button>'+
   '<button class="av" data-act="rename" title="Change name">'+esc((S.name||'?').charAt(0).toUpperCase())+'</button></div>';
  if(S.searching){var q=$('sq');if(q)q.focus()}
}
function renderDock(){
  var tot=S.tasks.length,d=S.tasks.filter(function(t){return t.done}).length,f=tot?d/tot:0,v=S.view;
  $('dock').innerHTML='<div class="tabs"><button class="tab'+(v!=='reports'?' on':'')+'" data-act="go" data-id="home">'+IC.home+'Home</button><button class="tab'+(v==='reports'?' on':'')+'" data-act="go" data-id="reports">'+IC.bars+'Reports</button></div>'+
   '<div class="dr"><button class="btn" data-act="addtask" style="font-size:17px;padding:12px 26px">Add new task</button>'+
   '<button class="help" data-act="help"><span class="ring"><svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="15" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="19" cy="19" r="15" fill="none" stroke="#7ee0a8" stroke-width="3" stroke-dasharray="'+(f*94.2).toFixed(1)+' 94.2" stroke-linecap="round"/></svg><b>'+d+'/'+tot+'</b></span><span>Help center</span></button></div>';
}

function taskHTML(t,showList){
  var live=S.active===t.id&&!S.paused;
  return '<div class="task'+(t.done?' done':'')+(live?' live':'')+'"><div class="row"><button class="chk" data-act="done" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button>'+
   '<span class="ttl" data-act="notes" data-id="'+t.id+'">'+esc(t.title)+'</span>'+
   '<span class="meta">'+(showList?esc(lname(t.list))+' · ':'')+'<span class="sp" data-id="'+t.id+'">'+fmt(t.spent)+'</span> / '+(t.est?estStr(t.est):'no est.')+'</span>'+
   (t.done?'':'<button class="btn sm" data-act="start" data-id="'+t.id+'">'+(live?'Live':'▶ Blitz')+'</button>')+
   '<button class="ib" data-act="del" data-id="'+t.id+'" title="Delete">✕</button></div>'+
   (t.open?'<textarea class="notes" data-id="'+t.id+'" placeholder="Notes, links, fleeting thoughts…">'+esc(t.notes)+'</textarea>':'')+'</div>';
}
function cardHTML(l){
  var pt=pending(l.id),est=pt.reduce(function(a,t){return a+(t.est||0)},0);
  var rows=!pt.length?'<div class="ac"><b>✓</b>ALL CLEAR</div>':pt.slice(0,5).map(function(t,i){return '<div class="lr"><b>'+(i+1)+'</b><span>'+esc(t.title)+'</span><em>'+(t.est?hhmm(t.est):'')+'</em></div>'}).join('');
  if(pt.length>5)rows+='<div class="meta" style="padding:2px 6px">+'+(pt.length-5)+' more</div>';
  var menu=S.menu===l.id?'<div class="mn"><button data-act="rn" data-id="'+l.id+'">Rename</button><button data-act="'+(l.arch?'restore':'archive')+'" data-id="'+l.id+'">'+(l.arch?'Restore':'Archive')+'</button><button data-act="dl" data-id="'+l.id+'">Delete</button></div>':'';
  return '<div class="lc" data-act="open" data-id="'+l.id+'"><div class="lh"><i style="'+(l.icon?'background-image:url('+l.icon+');background-size:cover;color:transparent':l.color?'background:'+l.color+';color:#111':'')+'">'+esc(l.name.charAt(0).toUpperCase())+'</i><span>'+esc(l.name)+'</span>'+(l.id==='all'?'':'<button class="ib" data-act="menu" data-id="'+l.id+'">⋮</button>')+'</div>'+menu+rows+
   '<button class="btn sm op" data-act="open" data-id="'+l.id+'">⤢ Open</button><div class="lf"><span>'+pt.length+' pending task'+(pt.length===1?'':'s')+'</span><span>Est: '+estStr(est)+'</span></div></div>';
}
function renderContent(){
  var v=S.view,h='';
  if(S.searching&&S.q.trim()){
    var q=S.q.trim().toLowerCase(),m=S.tasks.filter(function(t){return t.title.toLowerCase().indexOf(q)>-1||(t.notes||'').toLowerCase().indexOf(q)>-1});
    h='<div class="hd"><h2>Search</h2><span>'+m.length+' result'+(m.length===1?'':'s')+'</span></div>'+(m.length?m.map(function(t){return taskHTML(t,true)}).join(''):'<div class="empty">No matching tasks.</div>');
  }else if(v==='home'){
    h='<div class="hd"><h2>Your Lists</h2><span>Lists with your upcoming tasks</span></div><div class="grid">'+[{id:'all',name:'All Lists',color:'linear-gradient(135deg,#ffd84a,#6c8cff)'}].concat(S.lists.filter(function(l){return !l.arch})).map(cardHTML).join('')+'<div class="cl" data-act="newlist"><div>+</div><span>CREATE LIST</span></div></div>';
  }else if(v==='archived'){
    var a=S.lists.filter(function(l){return l.arch});
    h='<div class="hd"><h2>Archived lists</h2></div>'+(a.length?'<div class="grid">'+a.map(cardHTML).join('')+'</div>':'<div class="empty">No archived lists.</div>');
  }else if(v==='reports')h=reportsHTML();
  else if(v==='settings')h=settingsHTML();
  else if(curList()){
    var l=list(curList());if(!l){S.view='home';return renderContent()}
    var ts=S.tasks.filter(function(t){return t.list===l.id||l.id==='all'}).sort(function(a,b){return a.done-b.done});
    h='<button class="back" data-act="go" data-id="home">← All my lists</button><div class="hd"><h2>'+esc(l.name)+'</h2><span>'+pending(l.id).length+' pending</span></div>'+(ts.length?ts.map(function(t){return taskHTML(t)}).join(''):'<div class="empty">No tasks yet. Hit “Add new task” below.</div>');
  }
  $('content').innerHTML=h;
}
function reportsHTML(){
  var done=S.tasks.filter(function(t){return t.done}),tot=S.tasks.reduce(function(a,t){return a+t.spent},0),est=done.filter(function(t){return t.est}),ot=est.filter(function(t){return t.spent<=t.est*60}).length;
  var hm=function(s){return estStr(Math.round(s/60))};
  var h='<div class="hd"><h2>Reports</h2><span>Where your time goes</span></div><div class="stats"><div class="card2"><b>'+hm(tot)+'</b><span>Time tracked</span></div><div class="card2"><b>'+done.length+'</b><span>Tasks done</span></div><div class="card2"><b>'+(est.length?Math.round(ot/est.length*100)+'%':'—')+'</b><span>Within estimate</span></div></div><div class="card2"><b>Time by list</b>';
  S.lists.forEach(function(l){var s=S.tasks.filter(function(t){return t.list===l.id}).reduce(function(a,t){return a+t.spent},0),pc=tot?Math.round(s/tot*100):0;h+='<div class="hb"><span class="nm">'+esc(l.name)+'</span><span class="tr"><i style="width:'+pc+'%"></i></span><span class="meta">'+hm(s)+' · '+pc+'%</span></div>'});
  h+='</div><div class="card2"><b>Estimate vs actual</b>'+(est.length?est.slice(-8).map(function(t){var d=Math.round(t.spent/60-t.est);return '<div class="hb"><span style="flex:1">'+esc(t.title)+'</span><span class="meta" style="color:var(--'+(d<=0?'ok':'bad')+')">'+(d<=0?Math.abs(d)+'m early':d+'m over')+'</span></div>'}).join(''):'<p class="meta">Complete tasks that have an estimate to see this.</p>')+'</div>';
  return h;
}
function settingsHTML(){
  var p=S.pomo;
  return '<div class="hd"><h2>Settings</h2></div><div class="card2"><div class="set"><label><input type="checkbox" id="pon"'+(p.on?' checked':'')+'> Pomodoro mode</label><label>Work <input type="number" id="pw" min="5" value="'+p.work+'"> min</label><label>Break <input type="number" id="pb" min="1" value="'+p.brk+'"> min</label></div>'+
   '<div class="set"><label>Theme <select id="th" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px"><option value="">System</option><option value="light"'+(S.theme==='light'?' selected':'')+'>Light</option><option value="dark"'+(S.theme==='dark'?' selected':'')+'>Dark</option></select></label><button class="btn ghost sm" data-act="reset">Reset all data</button></div></div>';
}

function renderModal(){
  var m=S.modal,el=$('modal');
  if(!m){el.className='';el.innerHTML='';return}
  var h='<div class="mb">';
  if(m.type==='task'){
    var cl=curList()||(S.lists.filter(function(l){return !l.arch})[0]||{}).id;
    h+='<h3>Add new task</h3><input id="mt" placeholder="What needs doing?"><select id="ml">'+S.lists.filter(function(l){return !l.arch}).map(function(l){return '<option value="'+l.id+'"'+(l.id===cl?' selected':'')+'>'+esc(l.name)+'</option>'}).join('')+'</select><input id="me" type="number" min="0" step="5" placeholder="Estimate (minutes)"><textarea id="mn" placeholder="Notes (optional)"></textarea><div class="bt"><button class="btn ghost sm" data-act="mclose">Cancel</button><button class="btn sm" data-act="msave">Add task</button></div>';
  }else if(m.type==='prompt')h+='<h3>'+esc(m.title)+'</h3>'+(m.kind==='newlist'?'<label class="ic" style="'+(m.icon?'background-image:url('+m.icon+')':'background:'+m.color)+'">'+(m.icon?'':'🖼')+'<input type="file" id="mf" accept="image/*" hidden></label><p style="text-align:center;font-size:12px;margin:0 0 8px">UPLOAD AN ICON (optional)</p><div class="sws">'+COL.map(function(c,i){return '<button data-act="swatch" data-i="'+i+'" class="'+(c===m.color?'on':'')+'" style="background:'+c+'"></button>'}).join('')+'</div>':'')+'<input id="mi" placeholder="'+(m.kind==='name'?'Your name':'Enter your list title')+'" value="'+esc(m.value||'')+'"><div class="bt"><button class="btn ghost sm" data-act="mclose">Cancel</button><button class="btn sm" data-act="msave">Save</button></div>';
  else if(m.type==='confirm')h+='<h3>'+esc(m.title)+'</h3><p>This can’t be undone.</p><div class="bt"><button class="btn ghost sm" data-act="mclose">Cancel</button><button class="btn sm" data-act="myes">Yes, continue</button></div>';
  else if(m.type==='prefs')h+=prefsHTML();else if(m.type==='success')h+='<div style="text-align:center"><div style="font-size:60px">'+(S.pr.gif?'🎉':'✅')+'</div><h3>'+esc(m.msg)+'</h3><button class="btn" data-act="mclose">Keep going</button></div>';else h+='<h3>Help center</h3><p><kbd>N</kbd> new task · <kbd>Space</kbd> pause or resume · <kbd>Esc</kbd> leave Blitz mode</p><p>Tap ▶ Blitz on any task to start its timer. Estimates count down; going over turns the clock red. Turn on Pomodoro in Settings for work and break sprints.</p><div class="bt"><button class="btn sm" data-act="mclose">Got it</button></div>';
  el.innerHTML=h+'</div>';el.className='show';
  var f=el.querySelector('#mi,#mt');if(f)f.focus();
}

function renderFocus(){
  var f=$('focus'),t=S.active&&task(S.active);
  if(!t){f.className='';f.innerHTML='';document.body.classList.remove('blitz');document.title=BASE;return}
  f.className='show '+(S.pr.side==='left'?'l':'r');
  f.innerHTML='<div class="ft"><span id="phase"></span><span>'+esc(lname(t.list))+'</span></div><div class="ftt">'+esc(t.title)+'</div><div id="clock">00:00:00</div><div class="bar"><i id="pb2"></i></div><div class="btns"><button class="btn ghost sm" data-act="pause">'+(S.paused?'▶ Resume':'⏸ Pause')+'</button><button class="btn sm" data-act="done" data-id="'+t.id+'">✓ Done</button><button class="btn ghost sm" data-act="plus">+10 min</button><button class="btn ghost sm" data-act="ptoggle">🍅 '+(S.pomo.on?'On':'Off')+'</button><button class="btn ghost sm" data-act="blitz">⛶ Blitz</button><button class="btn ghost sm" data-act="stop">Stop</button></div>';
  tickUI();
}
function tickUI(){
  var t=S.active&&task(S.active),c=$('clock');if(!t||!c)return;
  var rem=t.est?t.est*60-t.spent:null;
  if(S.brk>0){c.textContent=fmt(S.brk);c.className='';$('phase').textContent='☕ Break time'}
  else if(rem===null){c.textContent=fmt(t.spent);c.className='';$('phase').textContent=(S.paused?'Paused':'Tracking')+(S.pomo.on?' · 🍅 '+fmt(S.pomo.work*60-S.sprint)+' left':'')}
  else{c.textContent=(rem<0?'+':'')+fmt(Math.abs(rem));c.className=rem<0?'over':'';$('phase').textContent=(S.paused?'Paused':rem<0?'Overtime':'Focusing')+(S.pomo.on?' · 🍅 '+fmt(S.pomo.work*60-S.sprint)+' left':'')}
  if(S.pr.scroll&&!S.paused){var ss=c.textContent+' • '+t.title+' • ',oo=t.spent%ss.length;document.title=ss.slice(oo)+ss.slice(0,oo)}else document.title=BASE;$('pb2').style.width=(t.est?Math.min(100,t.spent/(t.est*60)*100):0)+'%';
  var sp=document.querySelectorAll('.sp[data-id="'+t.id+'"]');for(var i=0;i<sp.length;i++)sp[i].textContent=fmt(t.spent);
}
function render(){document.body.classList.toggle('ht',!!S.pr.hide);if(!S.named&&!S.modal&&!render.a){render.a=1;S.name='';S.modal={type:'prompt',title:'Welcome! What’s your name?',value:'',kind:'name',color:COL[4]}}renderNav();renderTop();renderContent();renderDock();renderFocus();renderModal();save()}
function celebrate(m,big){if(big){if(S.pr.sfx)tone(S.pr.ssnd);if(S.pr.success){S.modal={type:'success',msg:m};return}}var c=$('cel');c.textContent=m;c.style.display='block';setTimeout(function(){c.style.display='none'},3200)}
function finish(id){
  var t=task(id);if(!t)return;
  if(t.done){t.done=false;render();return}
  t.done=true;
  if(S.active===id){S.active=null;S.paused=true;S.sprint=0;S.brk=0;document.body.classList.remove('blitz')}
  var d=t.est?Math.round(t.spent/60-t.est):null;
  celebrate(d===null?'Nice work! 💥':d<=0?'Well done! 💥 '+(d<0?'Finished '+Math.abs(d)+' min early':'Right on time'):'Done! ⏱ '+d+' min over — pad your next estimate',1);
  render();
}
setInterval(function(){
  var t=S.active&&task(S.active);if(!t||S.paused)return;
  if(S.brk>0){S.brk--;if(!S.brk){S.paused=true;note('Break over — ready for another sprint?');renderFocus()}tickUI();return}
  t.spent++;S.sprint++;
  if(S.pr.alerts&&S.pr.every&&t.spent%(S.pr.every*60)===0)ping(Math.round(t.spent/60)+' min on “'+t.title+'”');if(S.pomo.on&&S.sprint>=S.pomo.work*60){S.sprint=0;S.brk=S.pomo.brk*60;note('Sprint complete! Take a break ☕')}
  tickUI();if(t.spent%10===0)save();
},1000);

function ask(title,value,kind,id){S.modal={type:'prompt',title:title,value:value,kind:kind,id:id,color:COL[4]};renderModal()}
function sure(title,act,id){S.modal={type:'confirm',title:title,act:act,id:id};renderModal()}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(S.menu){S.menu=null;renderContent()}if(e.target.id==='modal'){S.modal=null;renderModal()}return}
  var a=el.dataset.act,id=el.dataset.id,t=id&&task(id);
  if(a!=='menu'&&S.menu&&a!=='rn'&&a!=='archive'&&a!=='restore'&&a!=='dl')S.menu=null;
  if(a==='go'){S.view=id;S.searching=false;S.q='';render()}
  else if(a==='open'){S.view='list:'+id;S.menu=null;S.searching=false;render()}
  else if(a==='newlist')ask('Create new list','','newlist');
  else if(a==='menu'){S.menu=S.menu===id?null:id;renderContent()}
  else if(a==='rn'){S.menu=null;ask('Rename list',lname(id),'rename',id)}
  else if(a==='archive'||a==='restore'){list(id).arch=a==='archive';S.menu=null;render()}
  else if(a==='dl'){S.menu=null;sure('Delete this list and its tasks?','dellist',id)}
  else if(a==='rename')ask('Your name',S.name,'name');
  else if(a==='addtask'){S.modal={type:'task'};renderModal()}
  else if(a==='help'){S.modal={type:'help'};renderModal()}
  else if(a==='mclose'){S.modal=null;renderModal()}
  else if(a==='reset')sure('Delete all lists, tasks and history?','reset');
  else if(a==='myes'){var m=S.modal;S.modal=null;
    if(m.act==='dellist'){if(S.tasks.some(function(x){return x.list===m.id&&x.id===S.active}))S.active=null;S.tasks=S.tasks.filter(function(x){return x.list!==m.id});S.lists=S.lists.filter(function(x){return x.id!==m.id});if(curList()===m.id)S.view='home';render()}
    else{try{localStorage.removeItem(KEY)}catch(x){}location.reload()}}
  else if(a==='msave'){var m=S.modal;
    if(m.type==='task'){var ti=$('mt').value.trim();if(!ti)return;S.tasks.push({id:uid(),title:ti,list:$('ml').value,est:parseInt($('me').value,10)||0,spent:0,done:false,notes:$('mn').value});S.modal=null;render()}
    else{var v=$('mi').value.trim();if(!v)return;S.modal=null;
      if(m.kind==='newlist'){var nl={id:uid(),name:v,arch:false,color:m.color,icon:m.icon};S.lists.push(nl);S.view='list:'+nl.id}
      else if(m.kind==='rename')list(m.id).name=v;else{S.name=v;S.named=true}
      render()}}
  else if(a==='ptoggle'){S.pomo.on=!S.pomo.on;S.sprint=0;render()}else if(a==='prefs'){S.modal={type:'prefs'};renderModal()}else if(a==='tg'){var k=el.dataset.k;if(k==='pomo')S.pomo.on=!S.pomo.on;else{S.pr[k]=!S.pr[k];if(k==='notif'&&S.pr.notif&&window.Notification&&Notification.permission==='default')Notification.requestPermission()}rp()}else if(a==='sg'){var k2=el.dataset.k,v2=el.dataset.v;if(k2==='theme'){S.theme=v2;if(v2)document.documentElement.setAttribute('data-theme',v2);else document.documentElement.removeAttribute('data-theme')}else S.pr[k2]=v2;rp()}else if(a==='pv')tone(S.pr[el.dataset.k]);else if(a==='swatch'){S.modal.color=COL[+el.dataset.i];var sb=document.querySelectorAll('.sws button');for(var q=0;q<sb.length;q++)sb[q].classList.toggle('on',q==el.dataset.i);var ic=document.querySelector('.ic');if(ic&&!S.modal.icon)ic.style.background=S.modal.color}else if(a==='search'){S.searching=!S.searching;S.q='';renderTop();renderContent()}
  else if(a==='blitznow'){var nx=S.tasks.filter(function(x){return !x.done})[0];if(nx){S.active=nx.id;S.paused=false;S.brk=0;render()}else celebrate('Nothing to blitz — add a task first')}
  else if(a==='done')finish(id);
  else if(a==='start'){S.active=id;S.paused=false;S.brk=0;render()}
  else if(a==='pause'){S.paused=!S.paused;render()}
  else if(a==='plus'){var at=task(S.active);if(at){at.est=(at.est||0)+10;render()}}
  else if(a==='stop'){S.active=null;S.paused=true;S.sprint=0;S.brk=0;document.body.classList.remove('blitz');render()}
  else if(a==='blitz')document.body.classList.toggle('blitz');
  else if(a==='del'&&t){if(S.active===id){S.active=null;S.paused=true}S.tasks=S.tasks.filter(function(x){return x.id!==id});render()}
  else if(a==='notes'&&t){t.open=!t.open;renderContent()}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='sq'){S.q=el.value;renderContent()}
  else if(el.classList.contains('notes')){var t=task(el.dataset.id);if(t){t.notes=el.value;save()}}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='mf'){var fl=e.target.files[0];if(fl&&fl.size<200000){var fr=new FileReader();S.modal.value=$('mi').value;fr.onload=function(){S.modal.icon=fr.result;renderModal()};fr.readAsDataURL(fl)}return}var pk=e.target.dataset&&e.target.dataset.pk;if(pk){var pv=e.target.value;if(pk==='work')S.pomo.work=+pv;else if(pk==='brk')S.pomo.brk=+pv;else if(pk==='every')S.pr.every=+pv;else S.pr[pk]=pv;if(/snd$/.test(pk))tone(pv);if(pk==='tz')renderTop();save();return}if(id==='pon'||id==='pw'||id==='pb'){S.pomo={on:$('pon').checked,work:Math.max(5,+$('pw').value||60),brk:Math.max(1,+$('pb').value||15)};save()}
  if(id==='th'){S.theme=e.target.value;if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');save()}
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Enter'&&S.modal&&tag==='input'){var b=document.querySelector('#modal [data-act="msave"]');if(b)b.click();return}
  if(e.key==='Escape'){document.body.classList.remove('blitz');if(S.modal){S.modal=null;renderModal()}}
  if(typing)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();S.modal={type:'task'};renderModal()}
  if(e.key===' '&&S.active){e.preventDefault();S.paused=!S.paused;render()}
});
render();
})();
</script>
</body>
</html>
